################################################################################
# Docker Compose file for starting up the service for testing in GitHub workflow
# This template provides comparable infrastructure to the real environment.
#   - mongodb
#   - redis
#   - floci (s3, sqs, sns - LocalStack-compatible)
#
# Both mongo and floci have init scripts included for setting up resources
# on startup. These scripts are in docker/scripts.
#
# It also includes a selenium-chrome container for running the browser headless.
#
# The services being tested are started up here using Docker images from
# DockerHub (or built from source when a matching branch exists).
# Each service has a .env config file in docker/config/.
# Services can reference each other by their container names.
# e.g. http://case-management-backend:8085/
#
################################################################################
services:
  ################################################################################
  # Headless browser, used by the test suite to actually run the tests against the
  # containers.
  selenium-chrome:
    image: selenium/standalone-chrome:123.0
    shm_size: 2g
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_MAX_INSTANCES=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    ports:
      - 4444:4444

  ################################################################################
  mongodb:
    image: mongo:6
    volumes:
      - ./docker/scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.hello().ok']
      interval: 5s
      start_period: 5s
      retries: 3

  ################################################################################
  floci:
    image: hectorvent/floci:1.5.5-aws
    environment:
      - FLOCI_DEFAULT_REGION=eu-west-2
    env_file:
      - ./docker/config/defaults.env
    volumes:
      # floci runs every script in this directory on startup (its equivalent
      # of localstack's /docker-entrypoint-initaws.d) — matches the mount
      # convention already used by management-be/-fe's compose/floci/start.d.
      - ./docker/scripts/localstack:/etc/floci/init/start.d:ro

  ################################################################################
  redis:
    image: redis:7
    restart: always
    command: redis-server --requirepass E2eTestRedisPassword
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          'E2eTestRedisPassword',
          '--no-auth-warning',
          'PING'
        ]
      interval: 5s
      start_period: 2s
      retries: 5

  ################################################################################
  epr-register-enrol-management-be:
    image: defradigital/epr-register-enrol-management-be:${MANAGEMENT_BE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/management-be.env
    depends_on:
      mongodb:
        condition: service_healthy
      floci:
        condition: service_started
    # MGT-4: published so the Node test process can call bespoke endpoints
    # with no management-fe UI (e.g. resume-from-query) directly. A browser-side
    # fetch from the management-fe origin hits management-be's deny-all CORS
    # policy; calling from Node instead sidesteps CORS entirely rather than
    # loosening that policy for the sake of tests. wdio.local.conf.js already
    # assumes management-be is reachable at localhost:8085.
    ports:
      - 8085:8085
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8085/health']
      interval: 5s
      start_period: 10s
      retries: 5

  ################################################################################
  epr-register-enrol-management-fe:
    image: defradigital/epr-register-enrol-management-fe:${MANAGEMENT_FE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/management-fe.env
    environment:
      - PORT=3000
    depends_on:
      epr-register-enrol-management-be:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 3000:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      start_period: 10s
      retries: 5
