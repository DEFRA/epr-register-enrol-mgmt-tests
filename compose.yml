################################################################################
# Docker Compose file for starting up the service for testing in GitHub workflow
# This template provides comparable infrastructure to the real environment.
#   - mongodb
#   - redis
#   - floci (s3, sqs, sns - LocalStack-compatible)
#
# Both mongo and floci have init scripts included for setting up resources
# on startup. These scripts are in docker/scripts.
#
# It also includes a selenium-chrome container for running the browser headless.
#
# The services being tested are started up here using Docker images from
# DockerHub (or built from source when a matching branch exists).
# Each service has a .env config file in docker/config/.
# Services can reference each other by their container names.
# e.g. http://case-management-backend:8085/
#
################################################################################
services:
  ################################################################################
  # Headless browser, used by the test suite to actually run the tests against the
  # containers.
  selenium-chrome:
    image: selenium/standalone-chrome:123.0
    ports:
      - 4444:4444

  ################################################################################
  mongodb:
    image: mongo:6
    volumes:
      - ./docker/scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.hello().ok']
      interval: 5s
      start_period: 5s
      retries: 3

  ################################################################################
  floci:
    image: hectorvent/floci:latest-aws
    environment:
      - FLOCI_DEFAULT_REGION=eu-west-2
    env_file:
      - ./docker/config/defaults.env
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3

  ################################################################################
  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 5s
      start_period: 2s
      retries: 5

  ################################################################################
  epr-register-enrol-management-be:
    image: defradigital/epr-register-enrol-management-be:${MANAGEMENT_BE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/management-be.env
    depends_on:
      mongodb:
        condition: service_healthy
      floci:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8085/health']
      interval: 5s
      start_period: 10s
      retries: 5

  ################################################################################
  epr-register-enrol-management-fe:
    image: defradigital/epr-register-enrol-management-fe:${MANAGEMENT_FE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/management-fe.env
    environment:
      - PORT=3000
    depends_on:
      epr-register-enrol-management-be:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 3000:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      start_period: 10s
      retries: 5

