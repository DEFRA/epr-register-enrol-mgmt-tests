################################################################################
# Docker Compose file for starting up the service for testing in GitHub workflow
# This template provides comparable infrastructure to the real environment.
#   - mongodb
#   - redis
#   - floci (s3, sqs, sns - LocalStack-compatible)
#
# Both mongo and floci have init scripts included for setting up resources
# on startup. These scripts are in docker/scripts.
#
# It also includes a selenium-chrome container for running the browser headless.
#
# The services being tested are started up here using Docker images from
# DockerHub (or built from source when a matching branch exists).
# Each service has a .env config file in docker/config/.
# Services can reference each other by their container names.
# e.g. http://case-management-backend:8085/
#
################################################################################
services:
  ################################################################################
  # Headless browser, used by the test suite to actually run the tests against the
  # containers.
  selenium-chrome:
    image: selenium/standalone-chrome:123.0
    shm_size: 2g
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_MAX_INSTANCES=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    ports:
      - 4444:4444

  ################################################################################
  mongodb:
    image: mongo:6
    volumes:
      - ./docker/scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.hello().ok']
      interval: 5s
      start_period: 5s
      retries: 3

  ################################################################################
  floci:
    image: hectorvent/floci:1.5.5-aws
    environment:
      - FLOCI_DEFAULT_REGION=eu-west-2
    env_file:
      - ./docker/config/defaults.env
    volumes:
      # floci runs every script in this directory on startup (its equivalent
      # of localstack's /docker-entrypoint-initaws.d) — matches the mount
      # convention already used by management-be/-fe's compose/floci/start.d.
      - ./docker/scripts/localstack:/etc/floci/init/start.d:ro

  ################################################################################
  redis:
    image: redis:7
    restart: always
    command: redis-server --requirepass E2eTestRedisPassword
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          'E2eTestRedisPassword',
          '--no-auth-warning',
          'PING'
        ]
      interval: 5s
      start_period: 2s
      retries: 5

  ################################################################################
  # Registration & Accreditation service backend stand-in.
  #
  # management-be's decision is atomic and gated by the Registration & Accreditation service: it pushes the status change
  # to the operator-journey backend and only completes the transition once that
  # push is acknowledged. That backend (epr-register-enrol-backend) is NOT in
  # this stack, so without something answering the push every decision strands
  # the item. This lightweight node stub answers 200 by default and can be
  # armed — per work-item id, over its published control port — to return 500
  # for the failure-path spec. See docker/stubs/operator-backend-stub.mjs.
  operator-backend-stub:
    image: node:22-alpine
    command: ['node', '/opt/stub/operator-backend-stub.mjs']
    volumes:
      - ./docker/stubs:/opt/stub:ro
    environment:
      - PORT=8080
    # Published so the TEST RUNNER (a host Node process, as it is for the
    # management-be leg) can arm/clear a failure for one work item before
    # submitting its decision. Overridable to coexist with a local 8090.
    ports:
      - ${OPERATOR_BACKEND_STUB_PORT:-8090}:8080
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      start_period: 3s
      retries: 5

  ################################################################################
  epr-register-enrol-management-be:
    image: defradigital/epr-register-enrol-management-be:${MANAGEMENT_BE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/management-be.env
    depends_on:
      mongodb:
        condition: service_healthy
      floci:
        condition: service_started
      operator-backend-stub:
        condition: service_healthy
    # RA-372. Published so the TEST RUNNER — a host Node process in every
    # configuration, `npm run test:github` included — can reach the backend
    # directly. One leg of the query lifecycle has no case-management UI at
    # all: `queried` → `updated` is triggered by the OPERATOR backend calling
    # `resume-from-query`, and the operator's service is not part of this
    # stack. Overridable so this file can coexist with a management-be
    # already holding 8085 on a developer's machine.
    ports:
      - ${MANAGEMENT_BE_PORT:-8085}:8085
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8085/health']
      interval: 5s
      start_period: 10s
      retries: 5

  ################################################################################
  epr-register-enrol-management-fe:
    image: defradigital/epr-register-enrol-management-fe:${MANAGEMENT_FE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/management-fe.env
    environment:
      - PORT=3000
    depends_on:
      epr-register-enrol-management-be:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 3000:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      start_period: 10s
      retries: 5
