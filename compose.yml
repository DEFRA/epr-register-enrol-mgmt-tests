################################################################################
# Docker Compose file for starting up the service for testing in GitHub workflow
# This template provides comparable infrastructure to the real environment.
#   - mongodb
#   - redis
#   - floci (s3, sqs, sns - LocalStack-compatible)
#
# Both mongo and floci have init scripts included for setting up resources
# on startup. These scripts are in docker/scripts.
#
# It also includes a selenium-chrome container for running the browser headless.
#
# The services being tested are started up here using Docker images from
# DockerHub (or built from source when a matching branch exists).
# Each service has a .env config file in docker/config/.
# Services can reference each other by their container names.
# e.g. http://epr-register-enrol-management-be:8085/
#
# The stack mirrors CDP test, so a spec behaves the same here as there:
#   - management-be, the operator journey backend and management-fe run with
#     their deployed (non-Development) settings: no seeded data, and every
#     service-to-service call authenticated with its own shared secret
#     (docker/config/secrets.env);
#   - ReEx and CDP's outbound proxy are stubbed outside the services
#     (external-services-stub), so the backends use their real HTTP clients;
#     GOV.UK Notify is the one exception: with no API key, management-be uses
#     its no-op client, which writes the same audit entries;
#   - the settings the RA-000 cdp-app-config change touches are switchable.
#     The defaults are CDP test after that change; to reproduce CDP test as it
#     was before it, start the stack with
#       docker compose --env-file docker/config/cdp-test-baseline.env up
#
################################################################################
services:
  ################################################################################
  # Headless browser, used by the test suite to actually run the tests against the
  # containers.
  selenium-chrome:
    image: selenium/standalone-chrome:123.0
    shm_size: 2g
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_MAX_INSTANCES=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    ports:
      - 4444:4444

  ################################################################################
  mongodb:
    image: mongo:6
    volumes:
      - ./docker/scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.hello().ok']
      interval: 5s
      start_period: 5s
      retries: 3

  ################################################################################
  floci:
    image: hectorvent/floci:1.5.5-aws
    environment:
      - FLOCI_DEFAULT_REGION=eu-west-2
    env_file:
      - ./docker/config/defaults.env
    volumes:
      # floci runs every script in this directory on startup (its equivalent
      # of localstack's /docker-entrypoint-initaws.d) — matches the mount
      # convention already used by management-be/-fe's compose/floci/start.d.
      - ./docker/scripts/localstack:/etc/floci/init/start.d:ro

  ################################################################################
  redis:
    image: redis:7
    restart: always
    command: redis-server --requirepass E2eTestRedisPassword
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          'E2eTestRedisPassword',
          '--no-auth-warning',
          'PING'
        ]
      interval: 5s
      start_period: 2s
      retries: 5

  ################################################################################
  # ReEx and outbound-proxy stand-ins (docker/stubs/external-services-stub.mjs).
  # The backends call ReEx through their real HTTP client and the proxy, as
  # they do on CDP test, and it answers 404 for every organisation.
  external-services-stub:
    image: node:22-alpine
    command: ['node', '/opt/stub/external-services-stub.mjs']
    volumes:
      - ./docker/stubs:/opt/stub:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      start_period: 3s
      retries: 5

  ################################################################################
  # The operator journey backend. management-be pushes every decision to it and
  # only completes the decision once it is acknowledged, and it creates the
  # case-management work item when an operator submits, so decision specs
  # create their items through it (test/support/operator-backend-api.js).
  epr-register-enrol-backend:
    image: defradigital/epr-register-enrol-backend:${OPERATOR_BE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/operator-backend.env
    environment:
      - TestOrganisations__Enabled=${TEST_ORGANISATIONS_ENABLED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      external-services-stub:
        condition: service_healthy
    # Published so the TEST RUNNER (a host Node process, as for management-be)
    # can create applications through the operator journey's API. Overridable
    # to coexist with a local 8080.
    ports:
      - ${OPERATOR_BACKEND_PORT:-8080}:8080
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 5s
      start_period: 20s
      retries: 10

  ################################################################################
  epr-register-enrol-management-be:
    image: defradigital/epr-register-enrol-management-be:${MANAGEMENT_BE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/management-be.env
    # The values that differ between CDP test as it was (see
    # docker/config/cdp-test-baseline.env) and CDP test with the RA-000
    # cdp-app-config change, which is the default. Scotland is always
    # defined, empty by default, so the stack can never resolve a real
    # regulator mailbox from management-be's appsettings.json.
    environment:
      - TestOrganisations__Enabled=${TEST_ORGANISATIONS_ENABLED:-true}
      - Notify__TriggersEnabled__OperatorApplicationSubmission=${REGULATOR_TRIGGERS_ENABLED:-true}
      - Notify__TriggersEnabled__ApplicationWithdrawn=${REGULATOR_TRIGGERS_ENABLED:-true}
      - Notify__TriggersEnabled__OfficerAssignment=${REGULATOR_TRIGGERS_ENABLED:-true}
      - Notify__TriggersEnabled__QueryResponse=${REGULATOR_TRIGGERS_ENABLED:-true}
      - Notify__RegulatorMailboxes__Scotland=${SCOTLAND_REGULATOR_MAILBOX:-}
    depends_on:
      mongodb:
        condition: service_healthy
      floci:
        condition: service_started
      external-services-stub:
        condition: service_healthy
      epr-register-enrol-backend:
        condition: service_healthy
    # Published so the TEST RUNNER, a host Node process in every
    # configuration (`npm run test:github` included), can create its own work
    # items and play the operator's service for the operator-side transitions
    # (test/support/backend-api.js). Overridable so this file can coexist with
    # a management-be already holding 8085 on a developer's machine.
    ports:
      - ${MANAGEMENT_BE_PORT:-8085}:8085
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8085/health']
      interval: 5s
      start_period: 10s
      retries: 5

  ################################################################################
  epr-register-enrol-management-fe:
    image: defradigital/epr-register-enrol-management-fe:${MANAGEMENT_FE:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/management-fe.env
    environment:
      - PORT=3000
      # CDP test's value. RA-603's multiple interim sites need it on.
      - MULTIPLE_INTERIM_SITES_ENABLED=${MULTIPLE_INTERIM_SITES_ENABLED:-false}
    depends_on:
      epr-register-enrol-management-be:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 3000:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      start_period: 10s
      retries: 5
