################################################################################
# Docker Compose for journey tests in CI.
#
# Brings up the management backend + frontend (using the supplied image tags,
# defaulting to `latest`) together with their dependencies (MongoDB, Redis and
# the floci AWS emulator). The tests run on the GitHub runner host and hit the
# frontend on http://localhost:3000.
#
# Image tags are supplied via env vars:
#   EPR_REGISTER_ENROL_MANAGEMENT_BE
#   EPR_REGISTER_ENROL_MANAGEMENT_FE
################################################################################
services:
  selenium-chrome:
    image: selenium/standalone-chrome:123.0
    ports:
      - 4444:4444

  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongodb:
    image: mongo:7.0.28
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.hello().ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  case-management-backend:
    image: defradigital/epr-register-enrol-management-be:${EPR_REGISTER_ENROL_MANAGEMENT_BE:-latest}
    container_name: case-management-backend
    ports:
      - '8085:8085'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8085
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__DatabaseUri: mongodb://mongodb:27017/
      Mongo__DatabaseName: epr-register-case-management
      WorkItems__SeedOnStartup: 'true'
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8085/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  case-management-frontend:
    image: defradigital/epr-register-enrol-management-fe:${EPR_REGISTER_ENROL_MANAGEMENT_FE:-latest}
    container_name: case-management-frontend
    ports:
      - '3000:3000'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_healthy
      case-management-backend:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_HOST: redis
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: 'false'
      USE_SINGLE_INSTANCE_CACHE: 'true'
      REDIS_TLS: 'false'
      BACKEND_API_URL: http://case-management-backend:8085
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
