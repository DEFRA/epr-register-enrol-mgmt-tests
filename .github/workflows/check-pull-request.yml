name: Check Pull Request

on:
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts blocks dependency lifecycle scripts during the
      # install. The repo's .npmrc already sets ignore-scripts=true, so this is
      # behaviour-identical and only makes the intent explicit at the call site.
      - run: npm install -g npm@11.12.1 --ignore-scripts
      - run: |
          npm ci --ignore-scripts
          npm run format:check
          npm run lint

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build .

  tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout journey-tests repo
        uses: actions/checkout@v6
      - name: Run journey tests
        uses: ./run-journey-tests
        with:
          branch: ${{ github.head_ref }}
          journey-test-pr: true
