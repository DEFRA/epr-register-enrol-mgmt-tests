name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: Build, version and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build the test suite
        # Pinned to the commit that `main` resolved to on 2026-08-23. A branch
        # ref can be force-moved, so it is not a trustworthy supply-chain
        # anchor. NOTE: cdp-build-action is platform-managed and is normally
        # tracked at @main so CDP fixes land automatically -- see the PR
        # description before merging this hunk.
        uses: DEFRA/cdp-build-action/build-test@f95d7ca6ee42255191e17bbf5dd8e08810a189a3 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
