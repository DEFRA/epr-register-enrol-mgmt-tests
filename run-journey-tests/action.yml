name: Run Journey Tests on GitHub

inputs:
  management-fe:
    description: management-fe image tag (commit hash) to use
    required: false
    type: string
  management-be:
    description: management-be image tag (commit hash) to use
    required: false
    type: string
  branch:
    description: Branch in this repo to use when not a PR
    required: false
    default: main
    type: string
  journey-test-pr:
    description: Is this action being run from a PR in this repo?
    required: false
    default: 'false'
    type: string

runs:
  using: 'composite'
  steps:
    - name: Checkout repository if not called by Journey Test PR
      if: inputs.journey-test-pr == 'false'
      uses: actions/checkout@v6
      with:
        repository: DEFRA/epr-register-enrol-mgmt-tests
        ref: ${{ inputs.branch }}

    - name: Check for matching management-fe branch
      if: inputs.journey-test-pr != 'false'
      id: management-fe-branch
      shell: bash
      run: |
        BRANCH="${{ github.head_ref }}"
        if git ls-remote --heads https://github.com/DEFRA/epr-register-enrol-management-fe.git "$BRANCH" | grep -q .; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "ref=main" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout management-fe if matching branch exists
      if: inputs.journey-test-pr != 'false' && steps.management-fe-branch.outputs.exists == 'true'
      uses: actions/checkout@v6
      with:
        repository: DEFRA/epr-register-enrol-management-fe
        ref: ${{ steps.management-fe-branch.outputs.ref }}
        path: epr-register-enrol-management-fe

    - name: Set up Docker Buildx
      if: inputs.journey-test-pr != 'false'
      uses: docker/setup-buildx-action@v3

    - name: Build management-fe Docker image from source
      if: inputs.journey-test-pr != 'false' && steps.management-fe-branch.outputs.exists == 'true'
      id: docker-management-fe
      shell: bash
      run: |
        cd epr-register-enrol-management-fe
        MANAGEMENT_FE_SHA=$(git rev-parse --short HEAD)
        IMAGE_TAG="defradigital/epr-register-enrol-management-fe:${MANAGEMENT_FE_SHA}"
        docker buildx build \
          --cache-from type=gha,scope=mgmt-tests-management-fe \
          --cache-to type=gha,mode=max,scope=mgmt-tests-management-fe \
          --load \
          -t $IMAGE_TAG .
        echo "image=$MANAGEMENT_FE_SHA" >> "$GITHUB_OUTPUT"

    - name: Check for matching management-be branch
      if: inputs.journey-test-pr != 'false'
      id: management-be-branch
      shell: bash
      run: |
        BRANCH="${{ github.head_ref }}"
        if git ls-remote --heads https://github.com/DEFRA/epr-register-enrol-management-be.git "$BRANCH" | grep -q .; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout management-be if matching branch exists
      if: inputs.journey-test-pr != 'false' && steps.management-be-branch.outputs.exists == 'true'
      uses: actions/checkout@v6
      with:
        repository: DEFRA/epr-register-enrol-management-be
        ref: ${{ steps.management-be-branch.outputs.ref }}
        path: epr-register-enrol-management-be

    - name: Build management-be Docker image from source
      if: inputs.journey-test-pr != 'false' && steps.management-be-branch.outputs.exists == 'true'
      id: docker-management-be
      shell: bash
      run: |
        cd epr-register-enrol-management-be
        MANAGEMENT_BE_SHA=$(git rev-parse --short HEAD)
        IMAGE_TAG="defradigital/epr-register-enrol-management-be:${MANAGEMENT_BE_SHA}"
        docker buildx build \
          --cache-from type=gha,scope=mgmt-tests-management-be \
          --cache-to type=gha,mode=max,scope=mgmt-tests-management-be \
          --load \
          -t $IMAGE_TAG .
        echo "image=$MANAGEMENT_BE_SHA" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm install -g npm@11.12.1
      shell: bash
    - name: Install test dependencies
      run: npm ci
      shell: bash

    - name: Start docker compose
      shell: bash
      # Select each service image independently: prefer the image built from a
      # matching PR branch (management-fe / management-be), otherwise fall back
      # to the supplied/default image. This honours a matching management-be
      # branch even when there is no matching management-fe branch (e.g. a
      # backend-only change), which the previous fe-gated branching missed.
      run: |
        MANAGEMENT_FE=${{ steps.docker-management-fe.outputs.image || inputs.management-fe }} \
        MANAGEMENT_BE=${{ steps.docker-management-be.outputs.image || inputs.management-be }} \
        docker compose up --wait --wait-timeout 300 -d --quiet-pull

    - name: Run the tests
      shell: bash
      run: |
        npm run test:github
        npm run report

    - name: Collect logs
      if: always()
      shell: bash
      run: |
        docker compose logs > logs.txt
        docker ps

    - name: Upload allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report

    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./logs.txt

    - name: Check for test failures
      if: always()
      shell: bash
      run: if [ -f "FAILED" ]; then exit 1; fi
